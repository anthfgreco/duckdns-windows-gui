name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: build jar and windows bundle
        shell: pwsh
        run: ./build.ps1 -Bundle -Version "$($env:GITHUB_REF_NAME -replace '^v', '')"

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DuckDNS-Updater.jar
            dist/DuckDNS-Updater-windows-x64.zip
          generate_release_notes: true
