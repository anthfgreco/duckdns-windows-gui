name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: ensure wix toolset
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
          }

      - name: build jar, portable zip and installer
        shell: pwsh
        run: ./build.ps1 -Bundle -Installer -Version "$($env:GITHUB_REF_NAME -replace '^v', '')"

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DuckDNS-Windows-GUI.jar
            dist/DuckDNS-Windows-GUI.zip
            dist/DuckDNS-Windows-GUI-Setup.exe
          generate_release_notes: true
